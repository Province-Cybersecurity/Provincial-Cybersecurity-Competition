name: Import project bundle from base64

on:
  push:
    paths:
      - "project-upload.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode and extract project bundle
        run: |
          python3 - <<'PY'
          import base64
          import zipfile
          from pathlib import Path
          raw = Path('project-upload.b64').read_bytes()
          archive = Path('/tmp/project-upload.zip')
          archive.write_bytes(base64.b64decode(raw))
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = Path(info.filename)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  zf.extract(info, '.')
          PY
      - name: Remove transport files
        run: |
          rm -f project-upload.b64
          rm -f .github/workflows/import-base64.yml
      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project files to commit"
            exit 0
          fi
          git commit -m "feat: add XunAn website security inspection agent"
          git push
